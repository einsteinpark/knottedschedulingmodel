name: Weekly Knotted dashboard

# Daily at 7:00 AM Pacific — pulls the completed previous day. GitHub cron is UTC
# and does NOT follow DST, so 14:00 UTC = 7 AM PDT (summer, UTC-7). In PST (winter,
# UTC-8) it will fire at 6 AM Pacific; adjust to "0 15 * * *" in winter if you need
# it exact, or accept the one-hour seasonal drift.
on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch: {}   # lets you also trigger it manually from the Actions tab

permissions:
  contents: write          # to commit refreshed CSVs + publish the dashboard

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install wkhtmltopdf (for PDF export)
        run: sudo apt-get update && sudo apt-get install -y wkhtmltopdf

      - name: Run weekly pipeline
        env:
          TOAST_HOSTNAME:        ${{ secrets.TOAST_HOSTNAME }}
          TOAST_CLIENT_ID:       ${{ secrets.TOAST_CLIENT_ID }}
          TOAST_CLIENT_SECRET:   ${{ secrets.TOAST_CLIENT_SECRET }}
          TOAST_RESTAURANT_GUID: ${{ secrets.TOAST_RESTAURANT_GUID }}
          TOAST_TIMEZONE:        America/Los_Angeles
          SEVENSHIFTS_API_KEY:     ${{ secrets.SEVENSHIFTS_API_KEY }}
          SEVENSHIFTS_COMPANY_ID:  ${{ secrets.SEVENSHIFTS_COMPANY_ID }}
          SEVENSHIFTS_LOCATION_ID: ${{ secrets.SEVENSHIFTS_LOCATION_ID }}
        run: |
          python run_weekly.py --with-7shifts

      - name: Commit refreshed data + dashboard
        run: |
          git config user.name  "knotted-bot"
          git config user.email "actions@users.noreply.github.com"
          # GitHub Pages for this repo serves main branch root, so the dashboard
          # must land at ./index.html (the file Pages actually publishes).
          cp weekly_dashboard.html index.html
          git add data/ weekly_dashboard.html weekly_dashboard.pdf index.html run_log.json || true
          git commit -m "weekly auto-refresh $(date -u +%F)" || echo "nothing to commit"
          git push || echo "nothing to push"
